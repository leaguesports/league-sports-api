name: Test

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # prisma generate reads DATABASE_URL via prisma.config.ts; tests mock the DB
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/league?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate Prisma Client
        run: yarn prisma generate

      - name: Run tests
        run: yarn test

      - name: Typecheck
        run: yarn build
